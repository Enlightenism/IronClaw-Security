name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint deps
        run: pip install "ruff>=0.5,<1.0" "black>=24.0,<26.0"

      - name: ruff check
        run: ruff check .

      - name: black check
        run: black --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          IRONCLAW_PERSISTENCE_MODE: memory
          ENVIRONMENT: test
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          SUPABASE_KEY: ""
          SUPABASE_ANON_KEY: ""
        run: |
          pytest --tb=short --strict-markers