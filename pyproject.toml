[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironclaw-security"
version = "1.0.0"
description = "IronClaw Security local-first FastAPI defense layer with skill-style install and guarded runtime tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "IronClaw Security" }
]
keywords = [
  "security",
  "fastapi",
  "guardrails",
  "prompt-injection",
  "claude",
  "openclaw",
  "ai-security",
  "backup",
  "restore",
  "sdk",
  "cli"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "fastapi>=0.115,<0.136",
  "uvicorn[standard]>=0.30,<0.45",
  "httpx>=0.27,<1.0",
  "feedparser>=6.0.11,<7.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "stripe>=7.0.0,<10.0",
  "cryptography>=42.0.8",
  "PyJWT>=2.8.0",
  "typer[all]>=0.12,<0.16",
  "rich>=13.7,<15.0"
]

[project.optional-dependencies]
supabase = [
  "requests>=2.32,<3.0"
]
dev = [
  "black>=24.0,<26.0",
  "build>=1.2,<2.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<10.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "httpx2>=2.9,<3.0",
  "respx>=0.21,<1.0",
  "ruff>=0.11,<1.0",
  "anyio>=4.0,<5.0",
  "pydantic-settings>=2.3,<3.0",
  "stripe>=7.0.0,<10.0",
  "cryptography>=42.0.8",
  "reportlab>=4.2,<5.0"
]
pdf = [
  "reportlab>=4.2,<5.0"
]
docker = [
  "uvicorn[standard]>=0.30,<0.45",
  "pydantic-settings>=2.3,<3.0",
  "torch>=2.0",
  "transformers>=4.40",
  "tokenizers>=0.20",
  "safetensors>=0.4.5",
  "numpy>=1.26"
]
skill = [
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0"
]
sdk = [
  "httpx>=0.27,<1.0",
  "typer[all]>=0.12,<0.16",
  "rich>=13.7,<15.0"
]
all = [
  "pydantic-settings>=2.3,<3.0",
  "reportlab>=4.2,<5.0"
]

[project.urls]
Homepage = "https://github.com/Enlightenism/IronClaw-Security"
Repository = "https://github.com/Enlightenism/IronClaw-Security.git"
Documentation = "https://github.com/Enlightenism/IronClaw-Security#readme"

[project.scripts]
ironclaw = "app.cli.main:main"
ironclaw-installer = "ironclaw_installer:main"
ironclaw-brain = "cli_brain:main"
ironclaw-skill = "ironclawskill.cli:main"
ironclaw-smoketest = "smoketestclient:main"
ironclaw-testclient = "testclient:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "cli_brain",
  "ironclaw_installer",
  "ironclawclient",
  "ironclawshellguard",
  "ironclawtoolrunner",
  "smoketestclient",
  "testclient"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*",
  "ironclawskill*",
  "ironclaw_sdk*"
]
exclude = [
  "tests*",
  "docs*",
  "output*"
]
namespaces = false

[tool.setuptools.package-data]
ironclawskill = ["py.typed"]
ironclaw_sdk = ["py.typed", "openclaw_plugin/*.js", "openclaw_plugin/*.json", "hermes_plugin/*.yaml"]
app = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q -m 'not integration'"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning"
]
markers = [
  "asyncio: mark test as asyncio-based",
  "integration: mark test as a live integration test requiring a running server",
  "sdk: mark test as an SDK round-trip test using the IronclawClient and ASGI transport shim",
  "cli: mark test as a CLI-layer test",
  "allow_real_env: opt out of sanitized test env for tests that intentionally require real environment values"
]

[tool.ruff]
line-length = 300
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP"
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
  "app",
  "cli_brain",
  "core",
  "orchestrator",
  "review",
  "routes",
  "ironclawskill",
  "ironclaw_sdk"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 300
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = [
  "^output/",
  "^docs/"
]
