[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironclaw-security"
version = "0.1.0"
description = "IronClaw Security local-first FastAPI defense layer with skill-style install and guarded runtime tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "IronClaw Security" }
]
keywords = [
  "security",
  "fastapi",
  "guardrails",
  "prompt-injection",
  "claude",
  "openclaw",
  "ai-security",
  "backup",
  "restore"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "fastapi>=0.115,<0.136",
  "uvicorn[standard]>=0.30,<0.45",
  "httpx>=0.27,<0.28",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0"
]

[project.optional-dependencies]
supabase = [
  "requests>=2.32,<3.0"
]
dev = [
  "black>=24.0,<26.0",
  "build>=1.2,<2.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<10.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<1.0"
]
docker = [
  "uvicorn[standard]>=0.30,<0.45"
]
skill = [
  "httpx>=0.27,<0.28",
  "python-dotenv>=1.0,<2.0"
]

[project.urls]
Homepage = "https://github.com/Enlightenism/IronClaw-Security"
Repository = "https://github.com/Enlightenism/IronClaw-Security.git"
Documentation = "https://github.com/Enlightenism/IronClaw-Security#readme"

[project.scripts]
ironclaw-skill = "ironclawskill.cli:main"
ironclaw-smoketest = "smoketestclient:main"
ironclaw-testclient = "testclient:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "ironclawclient",
  "ironclawshellguard",
  "ironclawtoolrunner",
  "smoketestclient",
  "testclient"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*",
  "ironclawskill*"
]
exclude = [
  "tests*",
  "docs*",
  "output*"
]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning"
]
markers = [
  "integration: marks integration tests that touch live services or scripts"
]

[tool.ruff]
line-length = 300
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 300
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = [
  "^output/",
  "^docs/"
]