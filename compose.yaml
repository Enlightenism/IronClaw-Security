# compose.yaml — IronClaw-Security
# Service name: ironclaw | Container: ironclaw-security | Port: 8000
#
# USAGE
#   cp .env.example .env          # fill in all REQUIRED values first
#   docker compose up --build     # build and start
#   docker compose up -d          # detached
#   docker compose down           # stop and remove containers
#
# The env_file block loads every key from .env into the container.
# The environment block below pins runtime-critical values that must
# never be sourced from an absent .env — these are safe, non-secret
# defaults that prevent silent failure on a fresh install.
# Secret keys (SUPABASE_*, *_API_KEY) are loaded
# exclusively from .env and are intentionally absent here.

services:
  ironclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironclaw-security
    restart: unless-stopped
    init: true

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # -----------------------------------------------------------------------
      # Python / runtime
      # -----------------------------------------------------------------------
      PYTHONUNBUFFERED: "1"

      # -----------------------------------------------------------------------
      # Application identity
      # -----------------------------------------------------------------------
      APP_NAME: "IronClaw-Security"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: "production"
      DEBUG: "false"
      RELOAD: "false"
      API_PREFIX: "/api"

      # -----------------------------------------------------------------------
      # Server binding
      # -----------------------------------------------------------------------
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_BASE_URL: "http://127.0.0.1:8000"
      IRONCLAW_ENV: "production"
      IRONCLAW_BASE_URL: "http://127.0.0.1:8000"

      # -----------------------------------------------------------------------
      # Logging
      # -----------------------------------------------------------------------
      LOG_LEVEL: "INFO"
      STRUCTURED_LOGGING_ENABLED: "true"

      # -----------------------------------------------------------------------
      # Policy and verdict defaults
      # -----------------------------------------------------------------------
      DEFAULT_SCAN_VERDICT: "allow"
      DEFAULT_REVIEW_STATUS: "not_required"

      # -----------------------------------------------------------------------
      # Risk thresholds  (allow_max < quarantine_min <= block_min)
      # -----------------------------------------------------------------------
      RISK_THRESHOLD_ALLOW_MAX: "29"
      RISK_THRESHOLD_QUARANTINE_MIN: "30"
      RISK_THRESHOLD_BLOCK_MIN: "70"

      # -----------------------------------------------------------------------
      # Scan feature flags
      # -----------------------------------------------------------------------
      ENABLE_TEXT_SCANNING: "true"
      ENABLE_URL_SCANNING: "true"
      ENABLE_GITHUB_REPO_SCANNING: "true"
      ENABLE_ARCHIVE_SCANNING: "true"

      # -----------------------------------------------------------------------
      # Guard / execution control feature flags
      # -----------------------------------------------------------------------
      ENABLE_GUARD_ACTIONS: "true"
      ENABLE_GUARD_ACTION_POLICY: "true"
      ENABLE_GUARD_ACTION_DECISION: "true"
      ENABLE_QUARANTINE_REVIEW: "true"

      # -----------------------------------------------------------------------
      # Input size limits
      # -----------------------------------------------------------------------
      MAX_TEXT_CHARS: "100000"
      MAX_URL_LENGTH: "2048"
      MAX_ARCHIVE_NAME_LENGTH: "512"
      MAX_REPO_URL_LENGTH: "2048"

      # -----------------------------------------------------------------------
      # Authentication
      # IMPORTANT: Set AUTH_REQUIRED=true in production.
      # All *_API_KEY values must be set in .env — never hardcoded here.
      # -----------------------------------------------------------------------
      AUTH_REQUIRED: "false"

      # -----------------------------------------------------------------------
      # Local prompt guard
      # -----------------------------------------------------------------------
      GUARD_ENABLED: "true"
      GUARD_MODEL_PATH: "models/prompt-guard-86m"
      GUARD_THRESHOLD: "0.5"

      # -----------------------------------------------------------------------
      # File storage paths (mapped to the ./data volume mount)
      # -----------------------------------------------------------------------
      REPORTS_DIR: "/app/data/reports"
      UPLOADS_DIR: "/app/data/uploads"
      QUARANTINE_DIR: "/app/data/quarantine"
      BACKUP_DIR: "/app/data/backups"

    volumes:
      - ./data:/app/data

    read_only: true
    tmpfs:
      - /tmp
      - /app/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8000/api/health || curl --fail --silent http://127.0.0.1:8000/api/health/liveness || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

    networks:
      - ironclaw_net

networks:
  ironclaw_net:
    driver: bridge