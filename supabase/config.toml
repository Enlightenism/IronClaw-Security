# supabase/config.toml
# IronClaw-Security — Supabase project configuration
# CLI reference: https://supabase.com/docs/guides/cli/config

[project]
id = "ironclaw-security"

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# ---------------------------------------------------------------------------
# Studio
# ---------------------------------------------------------------------------

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# ---------------------------------------------------------------------------
# Inbucket (local SMTP)
# ---------------------------------------------------------------------------

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------

[storage]
enabled = true
file_size_limit = "50MiB"

# ---------------------------------------------------------------------------
# Edge Runtime
# ---------------------------------------------------------------------------

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------

# ironclaw-auth
# Handles Supabase Auth webhook callbacks and JWT validation helpers.
[functions.ironclaw-auth]
enabled = true
verify_jwt = true

# ironclaw-telemetry-ingest
# Receives agent telemetry events from IronClaw clients and writes to
# the telemetry_events table. JWT required.
[functions.ironclaw-telemetry-ingest]
enabled = true
verify_jwt = true

# ironclaw-webhook-dispatch
# Fan-out webhook delivery to registered tenant subscriptions.
# SECURITY: this endpoint is part of the internal payment/install-key lifecycle
# trust boundary and MUST remain JWT-protected; never allow public or mixed-trust
# access because it can fan out purchase fulfillment events after Stripe payment.
# Called server-side by webhook_service.py after every verdict.
# JWT required — only callable with service-role Bearer token.
[functions.ironclaw-webhook-dispatch]
enabled = true
verify_jwt = true

# ironclaw-threat-feed-sync
# Pulls fresh threat intelligence from configured upstream feeds and
# upserts into the threat_feed_entries table.
#
# Cron schedule: every 6 hours.
# Standard cron syntax: minute hour day-of-month month day-of-week
# "0 */6 * * *" = at minute 0 of every 6th hour (00:00, 06:00, 12:00, 18:00 UTC)
#
# EXTERNAL INVOCATION URL (for non-Supabase schedulers or CI triggers):
#   POST {SUPABASE_URL}/functions/v1/ironclaw-threat-feed-sync
#   Authorization: Bearer {SUPABASE_SERVICE_ROLE_KEY}
#   Content-Type: application/json
#   Body: {"trigger": "cron", "source": "external"}
#
# verify_jwt must be true in production. The cron invoker uses the
# service-role key which satisfies the JWT requirement.
[functions.ironclaw-threat-feed-sync]
enabled = true
verify_jwt = true
cron = "0 */6 * * *"

# ---------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------

[analytics]
enabled = false
port = 54327
backend = "postgres"

# ---------------------------------------------------------------------------
# Realtime
# ---------------------------------------------------------------------------

[realtime]
enabled = true
ip_version = "IPv6"
max_header_length = 4096
